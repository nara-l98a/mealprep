[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mealprep"
version = "1.0.0"
description = "中文食谱、食材和膳食计划 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Mealprep contributors"}]
dependencies = []

[project.scripts]
mealprep = "mealprep.app:main"

[tool.setuptools.packages.find]
where = ["src"]
